[pytest]
; Repo-root run:  `pytest`  -> agent-layer suite + backend suite.
; (You can still run the agent suite alone from inside agents/ - it has its own pytest.ini.)
pythonpath = .
testpaths = agents/tests backend/tests
; All tests are plain functions; class collection is disabled so agent classes
; such as `TestingAgent` are not mistaken for test classes.
python_classes =
python_files = test_*.py
python_functions = test_*
